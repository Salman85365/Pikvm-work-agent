[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pikvm-work-agent"
version = "0.1.1"
description = "A local, agentless work automation client for PiKVM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118,<1",
    "httpx>=0.27,<1",
    "keyring>=25.7,<26",
    "openai>=2.53,<3",
    "pillow>=10,<13",
    "pyotp>=2.10,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
    "zxing-cpp>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
pikvm-agent = "work_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/work_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/.env.example"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["work_agent"]
